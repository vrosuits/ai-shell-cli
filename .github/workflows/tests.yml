name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AISHELL_REQUIRE_SANDBOX: '1'
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python ai_shell_cli.py --demo --mode color --color never
      - run: node --check aishell.js
      - run: node aishell.js --demo --mode raw > /tmp/aishell-demo.py
      - run: python -m py_compile /tmp/aishell-demo.py
      - run: npm pack --dry-run
